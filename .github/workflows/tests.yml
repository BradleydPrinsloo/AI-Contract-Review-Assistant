name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PySide6 python-docx PyMuPDF python-dotenv openai

      - name: Compile source
        run: |
          python -m compileall -q contract_review_assistant
          python -m py_compile main.py service_main.py v2_main.py

      - name: Run tests
        run: python -m pytest -q
